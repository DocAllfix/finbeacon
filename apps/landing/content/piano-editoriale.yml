# Piano editoriale delle guide. Lo legge la routine della redazione
# (.claude/skills/redazione/SKILL.md) e lo aggiorna nella stessa PR della guida.
#
# Come è stato costruito (29/09/2026): radici del dominio del prodotto, poi
# `node scripts/suggerimenti.mjs "<radice>"` per le ricerche vere. `evidenze`
# riporta le query uscite dall'autocompletamento: dicono cosa la gente scrive,
# NON quanto. I volumi arriveranno da Search Console (revisione mensile).
#
# Campi
#   priorita   1 = prima. A pari priorità, prima i temi collegati a guide già uscite.
#   stato      da-fare | in-pr | pubblicata | sospesa
#   formato    pilastro (guida lunga che ne regge altre) | guida | strumento
#   solo-codice: true  = non è un articolo, serve codice (la routine lo salta).
#   verifica   cosa controllare sulle fonti PRIMA di scrivere.
#   motivo     solo con `stato: sospesa`: perché la voce è ferma e cosa la sblocca.
#   calendario id dell'uscita (M1-W1-01 = mese 1, settimana 1, primo articolo).
#   uscita     giorno previsto: la routine scrive prima la voce `da-fare` con l'uscita più vicina.
#   tipologia  pillar | bofu | mofu | tofu (posizione nel percorso del lettore).
#   dati       da dove viene la priorità (volume e CPC dell'export, o «senza volume»).
#   domande    le domande vere da coprire: diventano titoli `##` o la sezione finale di domande.
#   link_interni slug di guide (pubblicate o in calendario) da collegare: obbligatori se esistono.
#   cta        demo | calcolatore: dove porta la chiusura della guida.
#
# radici: le parole di partenza del dominio. Ogni domenica `cura-redazione.yml`
# raccoglie le ricerche vere per ciascuna e le salva sul ramo `dati/suggerimenti`;
# la routine le usa per rifornire il piano quando le voci `da-fare` scendono
# sotto sei (skill redazione, passo 1). Le radici nuove che emergono si aggiungono qui.

radici:
  - "dscr prospettico"
  - "dscr"
  - "adeguati assetti organizzativi"
  - "codice della crisi d'impresa"
  - "composizione negoziata"
  - "indici di allerta"
  - "indici di bilancio"
  - "analisi di bilancio"
  - "crisi d'impresa"
  - "continuità aziendale"
  - "budget di tesoreria"
  - "rendiconto finanziario"
  - "pfn ebitda"
  - "organo di controllo"

  - "ebitda"
  - "cash flow"
  - "free cash flow"
  - "indice di liquidità"
  - "margine di struttura"
  - "capitale circolante netto"
  - "oneri finanziari su ebitda"

