    motivo: >
      Sospesa dalla routine il 12/10/2026: il documento CNDCEC «Crisi d'impresa – Gli indici
      dell'allerta» non si apre dall'ambiente cloud (commercialisti.it risponde con una pagina
      anti-robot, cndcec.it chiude la connessione). Senza leggerlo non si può citare la pagina del
      segnale sul DSCR (REDAZIONE.md, regola 4). Si sblocca se una persona salva il PDF ufficiale
      nel repository (per esempio apps/landing/content/fonti/) o se il sito torna raggiungibile.
      Il 15/10/2026 commercialisti.it ha risposto dall'ambiente cloud (scaricato il documento CNDCEC
      di marzo 2024 su EBITDA e PFN): il blocco potrebbe essere tolto, riprovare a leggere il documento.
    verifica: >
