        "adeguati assetti organizzativi obbligo",
        "adeguati assetti organizzativi srl",
        "adeguati assetti 2086",
      ]
    evidenze:
      [
        "adeguati assetti organizzativi chi è obbligato",
        "adeguati assetti organizzativi srl",
        "adeguati assetti cosa sono",
        "adeguati assetti codice civile",
      ]
    intento: informativo
    argomento: crisi
    formato: pilastro
    priorita: 1
    stato: in-pr
    slug: adeguati-assetti-organizzativi
    data: 2026-10-02
    verifica: "Art. 2086 c.c. comma 2 e art. 3 CCII nel testo vigente su Normattiva."

  - id: art-3-ccii
    titolo: "Art. 3 CCII: misure e assetti adeguati, spiegato sui numeri"
    query: "art 3 ccii"
    secondarie: ["art 3 ccii spiegazione", "art 3 ccii normattiva"]
    evidenze:
      ["art 3 ccii", "art 3 ccii spiegazione", "art 3 ccii normattiva", "art 3 ccii brocardi"]
    intento: informativo
    argomento: crisi
    formato: guida
    priorita: 1
    stato: da-fare
    verifica: "Testo vigente dell'art. 3 (commi 3 e 4) su Normattiva, con la data dell'ultima modifica."

