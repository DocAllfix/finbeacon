    formato: guida
    priorita: 2
    stato: da-fare
    verifica: >
      Il sistema degli indici è cambiato fra il testo originario del CCII e le versioni successive
      (2022, correttivo 2024): ricostruire con le fonti primarie cosa vale OGGI prima di scrivere.
      Tema ad alto rischio di errore: se non è chiaro dalle fonti, stato sospesa.

