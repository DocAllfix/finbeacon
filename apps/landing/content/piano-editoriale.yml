# Piano editoriale delle guide. Lo legge la routine della redazione
# (.claude/skills/redazione/SKILL.md) e lo aggiorna nella stessa PR della guida.
#
# Come è stato costruito (29/09/2026): radici del dominio del prodotto, poi
# `node scripts/suggerimenti.mjs "<radice>"` per le ricerche vere. `evidenze`
# riporta le query uscite dall'autocompletamento: dicono cosa la gente scrive,
# NON quanto. I volumi arriveranno da Search Console (revisione mensile).
#
# Campi
#   priorita   1 = prima. A pari priorità, prima i temi collegati a guide già uscite.
#   stato      da-fare | in-pr | pubblicata | sospesa
#   formato    pilastro (guida lunga che ne regge altre) | guida | strumento
#   solo-codice: true  = non è un articolo, serve codice (la routine lo salta).
#   verifica   cosa controllare sulle fonti PRIMA di scrivere.

voci:
  - id: dscr-prospettico
    titolo: "DSCR prospettico a 6 mesi: come si calcola e che soglie usare"
    query: "dscr prospettico"
    secondarie:
      [
        "calcolo dscr prospettico",
        "calcolo dscr cndcec",
        "calcolo dscr formula",
        "calcolo dscr esempio",
      ]
    evidenze:
      [
        "calcolo dscr prospettico",
        "calcolo dscr cndcec",
        "calcolo dscr esempio",
        "calcolo dscr excel",
      ]
    intento: informativo
    argomento: crisi
    formato: pilastro
    priorita: 1
    stato: da-fare
    verifica: >
      Leggere il documento CNDCEC sugli indici dell'allerta (ottobre 2019) e annotare pagina e
      testo della soglia del DSCR. Scrivere le due soglie come da REDAZIONE.md, regola 4.
      Verificare se il correttivo del 2024 ha cambiato qualcosa sul DSCR.

  - id: calcolatore-dscr
    titolo: "Calcolo del DSCR prospettico a 6 mesi"
    query: "calcolo dscr prospettico"
    evidenze: ["calcolo dscr prospettico", "calcolo dscr excel gratis"]
    intento: strumento
    argomento: strumenti
    formato: strumento
    priorita: 1
    stato: da-fare
    solo-codice: true

  - id: adeguati-assetti
    titolo: "Adeguati assetti organizzativi: cosa sono e chi è obbligato"
